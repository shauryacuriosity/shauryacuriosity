name: Update contribution forest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install Pillow --quiet

      - name: Build profile SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: shauryacuriosity
        run: bash scripts/build-all.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet assets/; then
            echo "No changes"
          else
            git add assets/*.svg assets/profile.svg
            git commit -m "chore: rebuild profile SVG assets from GitHub API"
            git push
          fi