<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="planetsTitle">
  <title id="planetsTitle">Yuga, Cyra, Research</title>
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <radialGradient id="yugaCore" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#4ae8c0"/>
      <stop offset="55%" stop-color="#1a6878"/>
      <stop offset="100%" stop-color="#0a2838"/>
    </radialGradient>
    <radialGradient id="cyraCore" cx="40%" cy="38%">
      <stop offset="0%" stop-color="#ffb0e8"/>
      <stop offset="50%" stop-color="#c84898"/>
      <stop offset="100%" stop-color="#401838"/>
    </radialGradient>
    <radialGradient id="researchCore" cx="30%" cy="35%">
      <stop offset="0%" stop-color="#8ad878"/>
      <stop offset="60%" stop-color="#3a6838"/>
      <stop offset="100%" stop-color="#1a2818"/>
    </radialGradient>
    <filter id="planetGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .orbit, .pulse-core { animation: none !important; }
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes corePulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      .orbit {
        transform-origin: center;
        animation: orbitSpin 24s linear infinite;
      }
      .pulse-core {
        animation: corePulse 4s ease-in-out infinite;
      }
    </style>
  </defs>
  <rect width="720" height="240" fill="url(#panelBg)"/>

  <!-- YUGA -->
  <g transform="translate(120, 120)">
    <ellipse class="orbit motion" cx="0" cy="0" rx="58" ry="14" fill="none" stroke="#4ac8b0" stroke-width="1" opacity="0.5"/>
    <circle class="pulse-core motion" r="42" fill="url(#yugaCore)" filter="url(#planetGlow)"/>
    <ellipse cx="-12" cy="-14" rx="14" ry="10" fill="#ffffff" opacity="0.08"/>
  </g>
  <text x="120" y="48" text-anchor="middle" fill="#8cdcc8" font-family="system-ui,sans-serif" font-size="11" letter-spacing="0.25em">YUGA</text>
  <text x="120" y="200" text-anchor="middle" fill="#5a8078" font-size="9">Long arcs.</text>
  <text x="120" y="214" text-anchor="middle" fill="#5a8078" font-size="9">Deep roots.</text>

  <!-- CYRA -->
  <g transform="translate(360, 115)">
    <ellipse class="orbit motion" cx="0" cy="0" rx="62" ry="16" fill="none" stroke="#e888c8" stroke-width="1" opacity="0.55" style="animation-duration: 18s"/>
    <circle class="pulse-core motion" r="44" fill="url(#cyraCore)" filter="url(#planetGlow)" style="animation-delay: -1.5s"/>
    <circle cx="8" cy="-10" r="6" fill="#ffd0f0" opacity="0.15"/>
  </g>
  <text x="360" y="48" text-anchor="middle" fill="#e0a8d0" font-family="system-ui,sans-serif" font-size="11" letter-spacing="0.25em">CYRA</text>
  <text x="360" y="200" text-anchor="middle" fill="#907888" font-size="9">Bloom worlds.</text>
  <text x="360" y="214" text-anchor="middle" fill="#907888" font-size="9">Quiet light.</text>

  <!-- RESEARCH -->
  <g transform="translate(600, 122)">
    <ellipse class="orbit motion" cx="0" cy="0" rx="56" ry="13" fill="none" stroke="#78c868" stroke-width="1" opacity="0.5" style="animation-duration: 30s"/>
    <circle class="pulse-core motion" r="40" fill="url(#researchCore)" filter="url(#planetGlow)" style="animation-delay: -2s"/>
    <path d="M -15 5 Q 0 -5 15 8" fill="none" stroke="#a0e090" stroke-width="2" opacity="0.25"/>
  </g>
  <text x="600" y="48" text-anchor="middle" fill="#98d888" font-family="system-ui,sans-serif" font-size="11" letter-spacing="0.25em">RESEARCH</text>
  <text x="600" y="200" text-anchor="middle" fill="#688868" font-size="9">Curiosity.</text>
  <text x="600" y="214" text-anchor="middle" fill="#688868" font-size="9">For the long run.</text>

  <!-- Dividers -->
  <line x1="240" y1="40" x2="240" y2="220" stroke="#1a2830" stroke-width="1"/>
  <line x1="480" y1="40" x2="480" y2="220" stroke="#1a2830" stroke-width="1"/>
</svg>