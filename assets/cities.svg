<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="citiesTitle">
  <title id="citiesTitle">Sydney, Delhi, Munich</title>
  <defs>
    <linearGradient id="cityBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1620"/>
      <stop offset="100%" stop-color="#060a10"/>
    </linearGradient>
    <linearGradient id="duskFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="100%" stop-color="#142020"/>
    </linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e8ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00ffff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#00ffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panelSyd"><rect x="24" y="52" width="208" height="195" rx="8"/></clipPath>
    <clipPath id="panelDel"><rect x="256" y="52" width="208" height="195" rx="8"/></clipPath>
    <clipPath id="panelMun"><rect x="488" y="52" width="208" height="195" rx="8"/></clipPath>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .draw, .laser-sweep, .phase-built, .phase-blueprint, .arc-dash { animation: none !important; }
      }
      .draw {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawLine 8s ease-in-out infinite;
      }
      @keyframes drawLine {
        0%, 15% { stroke-dashoffset: 400; }
        35%, 55% { stroke-dashoffset: 0; }
        75%, 100% { stroke-dashoffset: 400; }
      }
      .laser-sweep {
        animation: laserMove 8s ease-in-out infinite;
      }
      @keyframes laserMove {
        0%, 20% { transform: translateX(-120px); opacity: 0; }
        30% { opacity: 1; }
        50%, 70% { transform: translateX(220px); opacity: 1; }
        80%, 100% { transform: translateX(220px); opacity: 0; }
      }
      .phase-built { animation: showBuilt 8s infinite; }
      .phase-blueprint { animation: showBlueprint 8s infinite; }
      @keyframes showBuilt {
        0%, 25% { opacity: 0; }
        45%, 85% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes showBlueprint {
        0%, 35% { opacity: 1; }
        55%, 100% { opacity: 0.15; }
      }
      .arc-dash {
        stroke-dasharray: 6 10;
        animation: arcTravel 5s linear infinite;
      }
      @keyframes arcTravel { to { stroke-dashoffset: -64; } }
    </style>
  </defs>
  <rect width="720" height="280" fill="url(#cityBg)"/>
  <text x="360" y="34" text-anchor="middle" fill="#9ec8d8" font-family="system-ui,sans-serif" font-size="12" letter-spacing="0.28em">SYDNEY · DELHI · MUNICH</text>

  <!-- Connecting arcs -->
  <path class="arc-dash" d="M 232 150 Q 360 115 488 150" fill="none" stroke="#2cc8b8" stroke-width="1.2" opacity="0.65" style="animation-delay: -1s"/>
  <path class="arc-dash" d="M 120 170 Q 360 95 600 170" fill="none" stroke="#2cc8b8" stroke-width="1" opacity="0.4"/>

  <!-- Sydney panel -->
  <g clip-path="url(#panelSyd)">
    <rect x="24" y="52" width="208" height="195" fill="#0a1418"/>
    <text x="128" y="72" text-anchor="middle" fill="#6a98a8" font-size="10" letter-spacing="0.2em">SYDNEY</text>
    <!-- Built: Opera House silhouette -->
    <g class="phase-built" opacity="0">
      <ellipse cx="128" cy="210" rx="90" ry="12" fill="#0a2830" opacity="0.6"/>
      <path d="M 60 200 Q 75 165 90 200 Q 100 175 110 200 Q 125 150 140 200 Q 155 170 170 200 Q 185 165 200 200 L 200 215 L 60 215 Z" fill="url(#duskFill)"/>
      <path d="M 88 200 Q 100 170 112 200" fill="none" stroke="#c8e0e8" stroke-width="1" opacity="0.5"/>
      <path d="M 128 155 Q 140 185 152 200" fill="none" stroke="#c8e0e8" stroke-width="1" opacity="0.5"/>
      <rect x="95" y="198" width="66" height="18" fill="#1a3040" rx="2"/>
    </g>
    <!-- Blueprint -->
    <g class="phase-blueprint" stroke="#3cd8ff" fill="none" stroke-width="1.2" opacity="1">
      <path class="draw" style="animation-delay: 0s" d="M 70 205 L 70 195 Q 85 160 100 195 Q 110 175 125 195 Q 140 145 155 195 Q 170 170 185 195 L 185 205"/>
      <path class="draw" style="animation-delay: 0.3s" d="M 95 205 L 160 205"/>
      <path class="draw" style="animation-delay: 0.6s" d="M 128 150 L 128 195"/>
    </g>
    <rect class="laser-sweep" x="24" y="120" width="40" height="120" fill="url(#laser)" opacity="0.5" style="animation-delay: 0s"/>
  </g>
  <rect x="24" y="52" width="208" height="195" fill="none" stroke="#1a3040" rx="8"/>

  <!-- Delhi panel -->
  <g clip-path="url(#panelDel)">
    <rect x="256" y="52" width="208" height="195" fill="#0a1418"/>
    <text x="360" y="72" text-anchor="middle" fill="#6a98a8" font-size="10" letter-spacing="0.2em">DELHI</text>
    <g class="phase-built" opacity="0">
      <rect x="300" y="175" width="120" height="40" fill="#2a3830"/>
      <path d="M 310 175 L 360 130 L 410 175 Z" fill="#3a4840"/>
      <rect x="355" y="145" width="10" height="35" fill="#4a5850"/>
      <ellipse cx="360" cy="218" rx="70" ry="8" fill="#152018"/>
    </g>
    <g class="phase-blueprint" stroke="#3cd8ff" fill="none" stroke-width="1.2">
      <path class="draw" style="animation-delay: 1s" d="M 310 175 L 360 125 L 410 175 L 410 215 L 310 215 Z"/>
      <path class="draw" style="animation-delay: 1.2s" d="M 355 125 L 355 175"/>
      <line class="draw" style="animation-delay: 1.4s" x1="330" y1="195" x2="390" y2="195"/>
    </g>
    <rect class="laser-sweep" x="256" y="120" width="40" height="120" fill="url(#laser)" opacity="0.5" style="animation-delay: 2.5s"/>
  </g>
  <rect x="256" y="52" width="208" height="195" fill="none" stroke="#1a3040" rx="8"/>

  <!-- Munich panel -->
  <g clip-path="url(#panelMun)">
    <rect x="488" y="52" width="208" height="195" fill="#0a1418"/>
    <text x="592" y="72" text-anchor="middle" fill="#6a98a8" font-size="10" letter-spacing="0.2em">MUNICH</text>
    <g class="phase-built" opacity="0">
      <rect x="530" y="165" width="124" height="55" fill="#2a3038" rx="2"/>
      <path d="M 545 165 L 562 120 L 580 165 Z" fill="#4a5058"/>
      <path d="M 595 165 L 618 95 L 642 165 Z" fill="#5a6068"/>
      <path d="M 572 165 L 592 110 L 612 165 Z" fill="#4a5058"/>
      <ellipse cx="592" cy="225" rx="65" ry="6" fill="#101820"/>
    </g>
    <g class="phase-blueprint" stroke="#3cd8ff" fill="none" stroke-width="1.2">
      <path class="draw" style="animation-delay: 2s" d="M 548 165 L 565 115 L 582 165"/>
      <path class="draw" style="animation-delay: 2.2s" d="M 598 165 L 622 92 L 646 165"/>
      <path class="draw" style="animation-delay: 2.4s" d="M 575 165 L 595 108 L 615 165"/>
      <rect class="draw" style="animation-delay: 2.6s" x="530" y="165" width="124" height="50"/>
    </g>
    <rect class="laser-sweep" x="488" y="120" width="40" height="120" fill="url(#laser)" opacity="0.5" style="animation-delay: 5s"/>
  </g>
  <rect x="488" y="52" width="208" height="195" fill="none" stroke="#1a3040" rx="8"/>

  <text x="360" y="268" text-anchor="middle" fill="#4a6878" font-family="system-ui,sans-serif" font-size="9" letter-spacing="0.15em">engineered live</text>
</svg>