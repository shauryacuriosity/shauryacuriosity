<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Shaurya Kansal</title>
  <desc id="heroDesc">Founder at SCYCLE AI, building Yuga. Dusk launch scene with global flight paths and forested coast.</desc>
  <defs>
    <linearGradient id="skyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1428"/>
      <stop offset="45%" stop-color="#1a2848"/>
      <stop offset="72%" stop-color="#4a3858"/>
      <stop offset="88%" stop-color="#c86a48"/>
      <stop offset="100%" stop-color="#e8a060"/>
    </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2030"/>
      <stop offset="100%" stop-color="#142838"/>
    </linearGradient>
    <linearGradient id="arcGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c8b4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#40e8d8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00c8b4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="exhaust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a0f0ff"/>
      <stop offset="100%" stop-color="#00aacc" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes dashTravel { to { stroke-dashoffset: -120; } }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.5; r: 3; }
        50% { opacity: 1; r: 5; }
      }
      @media (prefers-reduced-motion: reduce) {
        .motion, .rocket-lift, .path-travel, .exhaust-pulse { animation: none !important; }
        .rocket-lift { transform: translateY(0); }
      }
      .path-travel {
        stroke-dasharray: 8 14;
        animation: dashTravel 6s linear infinite;
      }
      .rocket-lift {
        animation: rocketFloat 14s ease-in-out infinite;
      }
      @keyframes rocketFloat {
        0%, 100% { transform: translateY(0); }
        45% { transform: translateY(-18px); }
      }
      .exhaust-pulse {
        animation: exhaustAnim 2s ease-in-out infinite;
      }
      @keyframes exhaustAnim {
        0%, 100% { opacity: 0.7; transform: scaleY(1); }
        50% { opacity: 1; transform: scaleY(1.15); }
      }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="720" height="500" fill="url(#skyTop)"/>

  <!-- Continental map hint -->
  <g opacity="0.18" fill="#5ce8c8">
    <ellipse cx="200" cy="165" rx="55" ry="35"/>
    <ellipse cx="380" cy="155" rx="70" ry="40"/>
    <ellipse cx="520" cy="170" rx="45" ry="28"/>
    <ellipse cx="580" cy="148" rx="30" ry="22"/>
  </g>

  <!-- World map dots -->
  <g opacity="0.55" fill="#5ce8c8">
    <circle class="motion" cx="120" cy="175" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle class="motion" cx="210" cy="150" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle class="motion" cx="320" cy="140" r="2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle class="motion" cx="430" cy="155" r="3" fill="#7fffd4" filter="url(#glow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle class="motion" cx="520" cy="130" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle class="motion" cx="580" cy="165" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle class="motion" cx="650" cy="145" r="2"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="200" r="1.5" opacity="0.4"/>
    <circle cx="380" cy="190" r="1.5" opacity="0.35"/>
    <circle cx="480" cy="185" r="1.5" opacity="0.4"/>
    <circle cx="150" cy="210" r="1.2" opacity="0.3"/>
    <circle cx="600" cy="195" r="1.5" opacity="0.35"/>
  </g>

  <!-- Flight paths -->
  <g fill="none" stroke="#3de8d0" stroke-width="1.2" opacity="0.7">
    <path class="path-travel motion" d="M 120 175 Q 180 120 320 140"/>
    <path class="path-travel motion" d="M 320 140 Q 400 100 520 130" style="animation-delay: -2s"/>
    <path class="path-travel motion" d="M 210 150 Q 300 90 430 155" style="animation-delay: -4s"/>
    <path class="path-travel motion" d="M 430 155 Q 520 110 650 145" style="animation-delay: -1s"/>
  </g>

  <!-- Atmospheric arc -->
  <path d="M 0 250 Q 360 200 720 255" fill="none" stroke="url(#arcGlow)" stroke-width="3" opacity="0.8"/>

  <!-- Title -->
  <text x="360" y="62" text-anchor="middle" fill="#eef6f8" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="300" letter-spacing="0.22em">SHAURYA KANSAL</text>
  <text x="360" y="88" text-anchor="middle" fill="#9ab8c8" font-family="system-ui,sans-serif" font-size="13" letter-spacing="0.06em">Founder, SCYCLE AI // building Yuga</text>

  <!-- Lake / water -->
  <path d="M 0 380 Q 180 360 360 375 T 720 385 L 720 500 L 0 500 Z" fill="url(#water)"/>

  <!-- Left cliff forest -->
  <path d="M 0 500 L 0 320 Q 80 280 140 300 Q 200 260 260 310 Q 220 340 180 380 Q 120 420 0 430 Z" fill="#0a1810"/>
  <g fill="#123820" opacity="0.9">
    <path d="M 40 340 L 55 310 L 70 340 Z"/>
    <path d="M 70 330 L 88 295 L 105 330 Z"/>
    <path d="M 100 350 L 118 315 L 135 350 Z"/>
    <path d="M 130 320 L 148 285 L 165 320 Z"/>
    <path d="M 160 360 L 175 330 L 190 360 Z"/>
    <path d="M 50 380 L 65 355 L 80 380 Z"/>
  </g>

  <!-- Right peninsula -->
  <path d="M 480 500 L 520 380 Q 560 340 620 350 Q 680 320 720 360 L 720 500 Z" fill="#0c1a12"/>
  <g fill="#164428">
    <path d="M 530 390 L 545 365 L 560 390 Z"/>
    <path d="M 570 375 L 590 340 L 610 375 Z"/>
    <path d="M 610 395 L 630 360 L 650 395 Z"/>
    <path d="M 650 380 L 670 350 L 690 380 Z"/>
    <path d="M 560 420 L 575 395 L 590 420 Z"/>
    <path d="M 600 410 L 615 385 L 630 410 Z"/>
    <path d="M 640 425 L 655 400 L 670 425 Z"/>
  </g>

  <!-- Launch pad -->
  <rect x="555" y="395" width="90" height="6" rx="2" fill="#2a3a40"/>
  <g class="rocket-lift motion" transform="translate(600, 330)">
    <ellipse class="exhaust-pulse" cx="0" cy="95" rx="22" ry="35" fill="url(#exhaust)" filter="url(#blurSoft)" opacity="0.85"/>
    <!-- Rocket body -->
    <path d="M -14 85 L -10 20 L 0 0 L 10 20 L 14 85 Z" fill="#e8eef2"/>
    <path d="M -10 20 L 0 5 L 10 20" fill="#c0d0d8"/>
    <rect x="-8" y="35" width="16" height="4" fill="#8899a8" opacity="0.6"/>
    <rect x="-8" y="55" width="16" height="4" fill="#8899a8" opacity="0.6"/>
    <path d="M -14 85 L -22 95 L -10 90 Z" fill="#b0bcc4"/>
    <path d="M 14 85 L 22 95 L 10 90 Z" fill="#b0bcc4"/>
  </g>

  <!-- Horizon mist -->
  <rect x="0" y="355" width="720" height="40" fill="#1a2838" opacity="0.25"/>
</svg>